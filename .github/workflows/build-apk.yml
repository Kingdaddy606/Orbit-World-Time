
name: Build Orbit World Time APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: unzip -o Orbit_World_Time_Android_Project.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install new launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path("extracted/WorldTimeAndroid")
          icon = Path("orbit_icon.png")
          manifest = root / "app/src/main/AndroidManifest.xml"
          source = root / "app/src/main/java/com/orbit/worldtime/MainActivity.kt"
          gradle_file = root / "app/build.gradle"

          if not icon.is_file():
              raise SystemExit(
                  "ERROR: orbit_icon.png is missing from the repository root."
              )

          for path in (manifest, source, gradle_file):
              if not path.is_file():
                  raise SystemExit(f"Required project file not found: {path}")

          # Give Android a dedicated image resource for the launcher.
          drawable = root / "app/src/main/res/drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(icon, drawable / "orbit_icon.png")
          print("Copied the new Orbit logo into drawable-nodpi.")

          # Make the application use the new image as its actual icon.
          xml = manifest.read_text(encoding="utf-8")
          match = re.search(r"<application\b[^>]*>", xml, re.DOTALL)

          if not match:
              raise SystemExit("Could not find the application tag in the manifest.")

          app_tag = match.group(0)

          if re.search(r'\bandroid:icon\s*=', app_tag):
              app_tag = re.sub(
                  r'\bandroid:icon\s*=\s*"[^"]*"',
                  'android:icon="@drawable/orbit_icon"',
                  app_tag,
                  count=1
              )
          else:
              app_tag = app_tag[:-1] + ' android:icon="@drawable/orbit_icon">'

          if re.search(r'\bandroid:roundIcon\s*=', app_tag):
              app_tag = re.sub(
                  r'\bandroid:roundIcon\s*=\s*"[^"]*"',
                  'android:roundIcon="@drawable/orbit_icon"',
                  app_tag,
                  count=1
              )

          xml = xml[:match.start()] + app_tag + xml[match.end():]
          manifest.write_text(xml, encoding="utf-8")
          print("Updated the manifest to use the new Orbit launcher icon.")

          # Fix the compiler error from the earlier build.
          code = source.read_text(encoding="utf-8")
          code = code.replace("singleLine = true", "setSingleLine(true)")
          source.write_text(code, encoding="utf-8")

          # Align Java and Kotlin compilation targets.
          gradle_code = gradle_file.read_text(encoding="utf-8")
          gradle_code = gradle_code.replace(
              "JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17"
          )
          gradle_code = gradle_code.replace("VERSION_1_8", "VERSION_17")
          gradle_code = gradle_code.replace(
              "jvmTarget = '1.8'", "jvmTarget = '17'"
          )
          gradle_code = gradle_code.replace(
              'jvmTarget = "1.8"', 'jvmTarget = "17"'
          )

          gradle_code += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          gradle_file.write_text(gradle_code, encoding="utf-8")
          print("Configured Java and Kotlin for JVM 17.")
          PY

      - name: Build APK
        run: |
          cd extracted/WorldTimeAndroid
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-World-Time-APK
          path: extracted/WorldTimeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
