
name: Build Orbit World Time APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: unzip -o Orbit_World_Time_Android_Project.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted/WorldTimeAndroid")
          app_gradle = root / "app" / "build.gradle"

          if not app_gradle.exists():
              raise SystemExit(f"Could not find {app_gradle}")

          text = app_gradle.read_text()
          text = text.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          text = text.replace("VERSION_1_8", "VERSION_17")
          text = text.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
          text = text.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')

          text += """

          // Force Java and Kotlin to use the same JVM target.
          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = JavaVersion.VERSION_17.toString()
              targetCompatibility = JavaVersion.VERSION_17.toString()
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          app_gradle.write_text(text)
          print("Updated app/build.gradle for Java 17.")
          PY

      - name: Build APK
        run: |
          cd extracted/WorldTimeAndroid
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-World-Time-APK
          path: extracted/WorldTimeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
