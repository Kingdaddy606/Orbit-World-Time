
name: Build Orbit World Time APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Orbit_World_Time_Premium_Minimalist_Fixed.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project ZIP exists
        run: |
          if [ ! -f "Orbit_World_Time_Premium_Minimalist_Fixed.zip" ]; then
            echo "ERROR: Orbit_World_Time_Premium_Minimalist_Fixed.zip was not found in the repository root."
            echo "Upload the redesigned project ZIP to the main repository page."
            exit 1
          fi

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o Orbit_World_Time_Premium_Minimalist_Fixed.zip -d extracted

          if [ ! -f "extracted/WorldTimeAndroid/settings.gradle" ] && \
             [ ! -f "extracted/WorldTimeAndroid/settings.gradle.kts" ]; then
            echo "ERROR: Android project files were not found at extracted/WorldTimeAndroid."
            echo "Check the folder structure inside the uploaded ZIP."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Configure Java and Kotlin targets
        working-directory: extracted/WorldTimeAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          if not path.exists():
              raise SystemExit("ERROR: app/build.gradle was not found.")

          text = path.read_text()

          if "compileOptions" not in text:
              text += """
          
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

          if "kotlinOptions" not in text:
              text += """
          
          android {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

          path.write_text(text)
          print("Gradle Java/Kotlin target configuration checked.")
          PY

      - name: Build debug APK
        working-directory: extracted/WorldTimeAndroid
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-World-Time-debug-apk
          path: extracted/WorldTimeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
