
name: Build Orbit World Time APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Orbit_World_Time_Premium_Restored.zip'
      - 'orbit_icon.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify project ZIP exists
        run: |
          test -f Orbit_World_Time_Premium_Restored.zip || {
            echo "ERROR: Orbit_World_Time_Premium_Restored.zip was not found in the repository root."
            exit 1
          }

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q Orbit_World_Time_Premium_Restored.zip -d extracted

          PROJECT_DIR="$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts inside the ZIP."
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Install existing repository icon
        run: |
          if [ -f orbit_icon.png ]; then
            mkdir -p "$PROJECT_DIR/app/src/main/res/drawable-nodpi"
            cp orbit_icon.png "$PROJECT_DIR/app/src/main/res/drawable-nodpi/orbit_icon.png"
            echo "Copied repository icon into Android resources."
          else
            echo "WARNING: orbit_icon.png was not found in the repository root."
          fi

      - name: Configure Java and Kotlin JVM targets
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle" "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import pathlib
          import sys

          groovy = pathlib.Path(sys.argv[1])
          kotlin = pathlib.Path(sys.argv[2])

          if groovy.exists():
              p = groovy
              text = p.read_text()
              if "compileOptions" not in text:
                  text += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """
              else:
                  import re
                  if re.search(r"sourceCompatibility\s+JavaVersion\.VERSION_1_8", text):
                      text = re.sub(r"sourceCompatibility\s+JavaVersion\.VERSION_1_8", "sourceCompatibility JavaVersion.VERSION_17", text)
                  if re.search(r"targetCompatibility\s+JavaVersion\.VERSION_1_8", text):
                      text = re.sub(r"targetCompatibility\s+JavaVersion.VERSION_1_8", "targetCompatibility JavaVersion.VERSION_17", text)
              if "kotlinOptions" not in text and "kotlin {" not in text:
                  text += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
              p.write_text(text)
          elif kotlin.exists():
              p = kotlin
              text = p.read_text()
              if "compileOptions" not in text:
                  text += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
              else:
                  text = text.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              if "jvmTarget" not in text:
                  text += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          """
              p.write_text(text)
          else:
              raise SystemExit("ERROR: app/build.gradle or app/build.gradle.kts was not found.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-World-Time-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
