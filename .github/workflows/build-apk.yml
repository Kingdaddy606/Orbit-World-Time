
name: Build Orbit World Time APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: unzip -o Orbit_World_Time_Android_Project.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Java and Kotlin targets
        run: |
          cat >> extracted/WorldTimeAndroid/app/build.gradle <<'GRADLE'

          // Ensure Java and Kotlin compile for the same JVM version.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          GRADLE

          echo "Applied Java 17 and Kotlin 17 compilation settings."

      - name: Build APK
        run: |
          cd extracted/WorldTimeAndroid
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-World-Time-APK
          path: extracted/WorldTimeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
