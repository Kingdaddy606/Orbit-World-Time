
name: Build Orbit World Time APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: unzip -o Orbit_World_Time_Android_Project.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Android source and compiler settings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted/WorldTimeAndroid")
          source = root / "app/src/main/java/com/orbit/worldtime/MainActivity.kt"
          gradle_file = root / "app/build.gradle"

          if not source.exists():
              raise SystemExit(f"Source file not found: {source}")

          code = source.read_text()
          if "singleLine = true" in code:
              code = code.replace("singleLine = true", "setSingleLine(true)")
              source.write_text(code)
              print("Fixed the singleLine compiler error.")
          else:
              print("singleLine assignment not found; checking compilation next.")

          if not gradle_file.exists():
              raise SystemExit(f"Gradle file not found: {gradle_file}")

          gradle_code = gradle_file.read_text()
          gradle_code = gradle_code.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )
          gradle_code = gradle_code.replace(
              "VERSION_1_8",
              "VERSION_17"
          )
          gradle_code = gradle_code.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )
          gradle_code = gradle_code.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          gradle_code += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          gradle_file.write_text(gradle_code)
          print("Configured Java and Kotlin for JVM 17.")
          PY

      - name: Build APK
        run: |
          cd extracted/WorldTimeAndroid
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-World-Time-APK
          path: extracted/WorldTimeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
