name: Build Orbit World Time APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Orbit_World_Time_Premium_Restored.zip'
      - 'orbit_icon.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Orbit World Time debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project and restore the icon already in the repository
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Orbit_World_Time_Premium_Restored.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: $ZIP_FILE is missing from the repository root."
            exit 1
          fi
          if [[ ! -f "orbit_icon.png" ]]; then
            echo "ERROR: orbit_icon.png is missing from the repository root. Keep the existing icon file there."
            exit 1
          fi
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          PROJECT="extracted/WorldTimeAndroid"
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          RES="$PROJECT/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi"
          cp orbit_icon.png "$RES/drawable-nodpi/orbit_icon.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp orbit_icon.png "$RES/mipmap-$density/orbit_launcher.png"
          done
          test -f "$RES/mipmap-xxxhdpi/orbit_launcher.png"
          echo "Using the repository's existing orbit_icon.png as the app launcher icon."

      - name: Build debug APK
        working-directory: extracted/WorldTimeAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-World-Time-debug-apk
          path: extracted/WorldTimeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
